name: KanaStudy
options:
  bundleIdPrefix: dev.kana-study
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO

targets:
  KanaStudy:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: KanaStudy
        excludes:
          - "Resources/Content/**/*.json"
          - "KanaStudyTests/**"
      - path: KanaStudy/Resources/Content
        type: folder
        buildPhase: resources
    resources:
      - KanaStudy/Assets.xcassets
      - KanaStudy/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.kana-study.KanaStudy
        PRODUCT_NAME: KanaStudy
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: KanaStudy/Info.plist
      properties:
        CFBundleDisplayName: 日语学习
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: AccentColor
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: 用于日语跟读录音与即时回听，不上传任何后端。
        NSSpeechRecognitionUsageDescription: 用于日语发音识别（可选）。

  KanaStudyTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: KanaStudyTests
    dependencies:
      - target: KanaStudy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.kana-study.KanaStudyTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/KanaStudy.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/KanaStudy"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES