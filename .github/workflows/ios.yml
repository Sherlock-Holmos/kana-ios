name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-simulator:
    name: Build (Simulator)
    runs-on: macos-14
    env:
      SCHEME: KanaStudy
      DERIVED_DATA: build/DerivedData-sim

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List available Xcodes
        run: |
          echo "=== /Applications contents ==="
          ls -la /Applications | grep -i xcode || true
          echo "=== xcode-select current ==="
          xcode-select -p || true

      - name: Pick latest stable Xcode
        run: |
          set -e
          CANDIDATE="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$CANDIDATE" ]; then
            CANDIDATE="$(xcode-select -p 2>/dev/null | sed 's|/Contents/Developer||' || true)"
          fi
          if [ -z "$CANDIDATE" ] || [ ! -d "$CANDIDATE" ]; then
            echo "::error::No usable Xcode found in /Applications"
            exit 1
          fi
          echo "Selected Xcode: $CANDIDATE"
          sudo xcode-select -s "$CANDIDATE/Contents/Developer"

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          else
            echo "xcodegen already installed: $(xcodegen --version)"
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project KanaStudy.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | tail -200
          if [ "${PIPESTATUS[0]}" -ne 0 ]; then
            echo "::error::xcodebuild failed; tail of build.log:"
            tail -100 build.log
            exit 1
          fi

      - name: Verify .app artifact
        run: |
          APP_PATH="$DERIVED_DATA/Build/Products/Debug-iphonesimulator/$SCHEME.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::App bundle not found at $APP_PATH"
            exit 1
          fi
          echo "Built simulator app at: $APP_PATH"
          ls -la "$APP_PATH"

      - name: Upload simulator .app
        uses: actions/upload-artifact@v4
        with:
          name: KanaStudy-simulator-app
          path: build/DerivedData-sim/Build/Products/Debug-iphonesimulator/KanaStudy.app
          if-no-files-found: error
          retention-days: 7

  build-ipa:
    name: Build (Device IPA, unsigned)
    runs-on: macos-14
    needs: build-simulator
    env:
      SCHEME: KanaStudy
      DERIVED_DATA: build/DerivedData-ipa

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pick latest stable Xcode
        run: |
          set -e
          CANDIDATE="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$CANDIDATE" ]; then
            CANDIDATE="$(xcode-select -p 2>/dev/null | sed 's|/Contents/Developer||' || true)"
          fi
          if [ -z "$CANDIDATE" ] || [ ! -d "$CANDIDATE" ]; then
            echo "::error::No usable Xcode found in /Applications"
            exit 1
          fi
          echo "Selected Xcode: $CANDIDATE"
          sudo xcode-select -s "$CANDIDATE/Contents/Developer"

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          else
            echo "xcodegen already installed: $(xcodegen --version)"
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS Device (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project KanaStudy.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_FOLDER_PATH="" \
            build 2>&1 | tee build.log | tail -200
          if [ "${PIPESTATUS[0]}" -ne 0 ]; then
            echo "::error::xcodebuild failed; tail of build.log:"
            tail -100 build.log
            exit 1
          fi

      - name: Package unsigned IPA
        run: |
          APP_PATH="$DERIVED_DATA/Build/Products/Release-iphoneos/$SCHEME.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::App bundle not found at $APP_PATH"
            exit 1
          fi
          mkdir -p dist/Payload
          cp -R "$APP_PATH" dist/Payload/
          cd dist
          zip -qr ../KanaStudy.unsigned.ipa Payload
          cd ..
          rm -rf dist
          ls -la KanaStudy.unsigned.ipa
          echo "--- IPA contents ---"
          unzip -l KanaStudy.unsigned.ipa | head -30

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: KanaStudy-unsigned-ipa
          path: KanaStudy.unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: KanaStudy-build-log-ipa
          path: build.log
          if-no-files-found: ignore
          retention-days: 3